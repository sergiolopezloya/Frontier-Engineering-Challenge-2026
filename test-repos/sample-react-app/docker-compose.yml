version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sample-react-app:local
    container_name: sample_react_app_local
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
